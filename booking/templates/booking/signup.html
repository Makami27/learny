{% extends 'booking/base.html' %}
{% block title %}Sign up — Learny{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <p class="eyebrow mb-1" style="font-family:'IBM Plex Mono',monospace;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gold-deep);">Get started</p>
      <h1 class="h3 mb-3">Create your account</h1>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Sign up</button>
      </form>
      <p class="mt-3 text-center">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
