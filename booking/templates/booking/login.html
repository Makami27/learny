{% extends 'booking/base.html' %}
{% block title %}Log in — Learny{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <p class="eyebrow mb-1" style="font-family:'IBM Plex Mono',monospace;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gold-deep);">Welcome back</p>
      <h1 class="h3 mb-3">Log in</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Log in</button>
      </form>
      <p class="mt-3 text-center">No account? <a href="{% url 'signup' %}">Sign up</a></p>
    </div>
  </div>
</div>
{% endblock %}
