{% extends 'booking/base.html' %}
{% block title %}Add Child — Learny{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h1 class="h4 mb-3">Add a child</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Save</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
