{% extends 'booking/base.html' %}
{% block title %}Request a Lesson — Learny{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h1 class="h4 mb-3">Request a lesson with {{ teacher.user.get_full_name|default:teacher.user.username }}</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Send Request</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
